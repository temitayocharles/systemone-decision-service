openapi: 3.0.3
info:
  title: System One Decision Runtime
  version: 0.3.0
  description: Provider-independent runtime for typed probabilistic decisions.
servers:
  - url: http://localhost:8002
paths:
  /health:
    get:
      summary: Runtime health
      responses:
        '200':
          description: Runtime is healthy
  /v2/decide:
    post:
      summary: Execute a typed decision request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeRequest'
      responses:
        '200':
          description: Decision result
        '502':
          description: Routing, provider, or inference failure
  /v2/batch:
    post:
      summary: Execute isolated decision requests as one batch
      responses:
        '200':
          description: Per-item results
  /v2/providers:
    get:
      summary: List configured inference instances and capabilities
      responses:
        '200':
          description: Inference-instance metadata
  /v2/metrics:
    get:
      summary: Runtime telemetry summary
      responses:
        '200':
          description: Runtime metrics
  /v2/benchmarks:
    get:
      summary: List empirical benchmark records
      responses:
        '200':
          description: Benchmark records
    put:
      summary: Persist a benchmark record with provenance
      responses:
        '200':
          description: Benchmark record persisted
  /v2/calibration/fit:
    post:
      summary: Fit and persist a calibration profile
      responses:
        '200':
          description: Persisted calibration profile
        '422':
          description: Invalid or insufficient calibration observations
components:
  schemas:
    RuntimeRequest:
      type: object
      required: [state, questions]
      properties:
        state:
          nullable: true
        questions:
          type: object
          minProperties: 1
          additionalProperties:
            type: object
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        policy:
          type: object
          nullable: true
        ensemble:
          type: array
          items:
            type: string
        request_id:
          type: string
          nullable: true
