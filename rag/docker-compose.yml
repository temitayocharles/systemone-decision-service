services:
  ollama:
    image: ollama/ollama:latest
    container_name: systemone-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  rag:
    build: .
    ports:
      - "8001:8001"
    environment:
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen2.5:3b
      EMBED_MODEL: nomic-embed-text
      OLLAMA_HOST: http://ollama:11434
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      RAG_PORT: "8001"
    depends_on:
      chroma:
        condition: service_started
      ollama:
        condition: service_healthy

  chroma:
    image: chromadb/chroma:latest
    container_name: systemone-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma

volumes:
  chroma-data:
  ollama-data:
